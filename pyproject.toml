[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openpaper-mcp"
version = "0.1.2"
description = "Autonomous research MCP server: auto research from a prompt to a fully-cited academic paper with verified citations"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[project.scripts]
openpaper-mcp = "server:main"

[project.urls]
Homepage = "https://openpaper.dev?utm_source=mcp_registry&utm_medium=pypi"
Repository = "https://github.com/federicodeponte/openpaper-mcp"
